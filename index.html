<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6D4AFF">
<meta name="description" content="KredVouch — Find skilled people. Trust their experience.">

<title>KredVouch — Skills • Experience • Trust</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root{
  --purple:#6d4aff;
  --purple-dark:#5033d7;
  --lavender:#f4f1ff;
  --lavender-2:#ebe6ff;
  --green:#1e9b67;
  --green-soft:#e9f8f1;
  --text:#17152a;
  --muted:#6f6b7d;
  --border:#e8e5ef;
  --white:#ffffff;
  --bg:#faf9fd;
  --danger:#c83d54;
  --shadow:0 18px 50px rgba(49,35,105,.10);
  --radius:22px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"DM Sans",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

/* =========================
   INTRO
========================= */

#intro{
  position:fixed;
  inset:0;
  z-index:9999;
  background:linear-gradient(145deg,#ffffff 0%,#f4f1ff 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .65s ease, visibility .65s ease;
}

#intro.hide{
  opacity:0;
  visibility:hidden;
}

.intro-inner{
  text-align:center;
  animation:introIn 1s cubic-bezier(.22,1,.36,1);
}

.intro-logo{
  font-family:"Plus Jakarta Sans",sans-serif;
  font-size:clamp(38px,11vw,66px);
  font-weight:800;
  letter-spacing:-2.8px;
  color:var(--text);
}

.intro-logo span{
  color:var(--purple);
}

.intro-tagline{
  margin-top:12px;
  color:var(--muted);
  font-size:14px;
  letter-spacing:.3px;
}

@keyframes introIn{
  from{
    opacity:0;
    transform:translateY(18px) scale(.96);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(250,249,253,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(232,229,239,.75);
}

.header-inner{
  max-width:1120px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.brand{
  border:0;
  background:none;
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--text);
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(145deg,#7658ff,#5839dc);
  display:grid;
  place-items:center;
  color:white;
  font-family:"Plus Jakarta Sans";
  font-weight:800;
  box-shadow:0 8px 22px rgba(109,74,255,.24);
}

.brand-name{
  font-family:"Plus Jakarta Sans";
  font-size:18px;
  font-weight:800;
  letter-spacing:-.5px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.language-select{
  border:1px solid var(--border);
  background:white;
  color:var(--text);
  border-radius:12px;
  padding:9px 10px;
  outline:none;
}

.icon-button{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:13px;
  background:white;
  color:var(--text);
}

/* =========================
   SCREEN SYSTEM
========================= */

#screenRoot{
  position:relative;
  min-height:calc(100vh - 71px);
}

.screen{
  width:100%;
  min-height:calc(100vh - 71px);
  padding:26px 18px 50px;
}

.screen-inner{
  max-width:920px;
  margin:auto;
}

.screen.enter-forward{
  animation:forwardIn .42s cubic-bezier(.22,1,.36,1);
}

.screen.enter-back{
  animation:backIn .42s cubic-bezier(.22,1,.36,1);
}

@keyframes forwardIn{
  from{
    opacity:0;
    transform:translateX(34px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes backIn{
  from{
    opacity:0;
    transform:translateX(-34px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   HOME
========================= */

.hero{
  max-width:900px;
  margin:0 auto;
  padding:65px 0 25px;
  text-align:center;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 13px;
  border-radius:999px;
  background:var(--green-soft);
  color:var(--green);
  font-size:12px;
  font-weight:700;
  margin-bottom:22px;
}

.eyebrow-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
}

.hero h1{
  font-family:"Plus Jakarta Sans";
  font-size:clamp(40px,9vw,74px);
  line-height:1.02;
  letter-spacing:-3.6px;
  font-weight:800;
}

.hero h1 .purple{
  color:var(--purple);
}

.hero p{
  max-width:650px;
  margin:24px auto 0;
  color:var(--muted);
  font-size:17px;
  line-height:1.75;
}

.hero-actions{
  margin:31px auto 0;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
  border-radius:14px;
  padding:14px 20px;
  font-weight:700;
  border:1px solid transparent;
  transition:.2s ease;
}

.primary-btn{
  background:var(--purple);
  color:white;
  box-shadow:0 12px 28px rgba(109,74,255,.24);
}

.primary-btn:hover{
  background:var(--purple-dark);
  transform:translateY(-1px);
}

.secondary-btn{
  background:white;
  color:var(--text);
  border-color:var(--border);
}

.secondary-btn:hover{
  border-color:#cfc8f4;
  transform:translateY(-1px);
}

.hero-note{
  margin-top:14px;
  color:#9994a5;
  font-size:12px;
}

/* =========================
   TRUST STRIP
========================= */

.trust-section{
  max-width:900px;
  margin:45px auto 0;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:24px 0;
}

.trust-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
}

.trust-item{
  padding:5px 24px;
  border-right:1px solid var(--border);
}

.trust-item:last-child{
  border-right:0;
}

.trust-number{
  color:var(--purple);
  font-family:"Plus Jakarta Sans";
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
}

.trust-item h3{
  font-family:"Plus Jakarta Sans";
  font-size:16px;
}

.trust-item p{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
  margin-top:5px;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;
  padding:42px 20px 26px;
  color:#9994a5;
  font-size:12px;
}

.footer strong{
  color:#625d70;
}

/* =========================
   PAGE TITLE
========================= */

.page-top{
  margin:8px auto 26px;
  max-width:720px;
}

.back-btn{
  border:0;
  background:none;
  color:var(--muted);
  font-weight:600;
  padding:7px 0;
  margin-bottom:19px;
}

.page-top h1{
  font-family:"Plus Jakarta Sans";
  font-size:clamp(28px,7vw,42px);
  letter-spacing:-1.5px;
}

.page-top p{
  color:var(--muted);
  line-height:1.65;
  margin-top:8px;
}

/* =========================
   CARD
========================= */

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:0 10px 35px rgba(40,30,85,.055);
  padding:22px;
}

.form-card{
  max-width:720px;
  margin:auto;
}

.form-section{
  margin-bottom:27px;
}

.form-section:last-child{
  margin-bottom:0;
}

.form-section-title{
  font-family:"Plus Jakarta Sans";
  font-size:16px;
  margin-bottom:15px;
}

.form-section-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:-8px;
  margin-bottom:15px;
}

.field{
  margin-bottom:16px;
}

.field:last-child{
  margin-bottom:0;
}

.field label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin-bottom:7px;
}

.optional{
  color:#9c97a8;
  font-weight:500;
}

.helper{
  color:#8b8698;
  font-size:11px;
  line-height:1.5;
  margin-top:6px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff;
  color:var(--text);
  padding:13px 14px;
  outline:none;
  transition:border .2s,box-shadow .2s;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#a99af5;
  box-shadow:0 0 0 4px rgba(109,74,255,.08);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

/* =========================
   SKILLS
========================= */

.chip-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.chip{
  border:1px solid var(--border);
  background:white;
  color:#5d586b;
  border-radius:999px;
  padding:9px 13px;
  font-size:12px;
  font-weight:600;
}

.chip.active{
  background:var(--lavender);
  border-color:#b6a9fb;
  color:var(--purple-dark);
}

/* =========================
   LOCATION
========================= */

.location-box{
  border:1px solid var(--border);
  border-radius:16px;
  padding:13px;
  background:#fcfbff;
}

.location-value{
  min-height:22px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin-bottom:10px;
}

.location-value.selected{
  color:var(--text);
  font-weight:600;
}

.location-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.small-btn{
  border:1px solid var(--border);
  background:white;
  color:var(--text);
  border-radius:10px;
  padding:9px 11px;
  font-size:12px;
  font-weight:700;
}

.small-btn.primary{
  border-color:var(--purple);
  background:var(--purple);
  color:white;
}

#map{
  height:320px;
  border-radius:16px;
  overflow:hidden;
  margin-top:12px;
  display:none;
}

.map-search{
  display:none;
  margin-top:10px;
}

/* =========================
   UPLOAD
========================= */

.upload-box{
  border:1px dashed #cfc9df;
  border-radius:16px;
  padding:18px;
  background:#fcfbff;
}

.upload-box input{
  border:0;
  padding:0;
  background:none;
}

.upload-preview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.upload-preview img{
  width:100%;
  height:90px;
  object-fit:cover;
  border-radius:10px;
}

/* =========================
   LANGUAGE
========================= */

.language-options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.lang-chip{
  border:1px solid var(--border);
  background:white;
  border-radius:999px;
  padding:9px 12px;
  font-size:12px;
  font-weight:600;
}

.lang-chip.active{
  background:var(--lavender);
  border-color:#b6a9fb;
  color:var(--purple-dark);
}

/* =========================
   FORM FOOT
========================= */

.form-footer{
  margin-top:22px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.full-btn{
  width:100%;
  padding:14px 18px;
  border-radius:14px;
  border:0;
  background:var(--purple);
  color:white;
  font-weight:800;
  box-shadow:0 10px 25px rgba(109,74,255,.2);
}

.status{
  margin-top:13px;
  font-size:12px;
  line-height:1.5;
  display:none;
}

.status.success{
  display:block;
  color:var(--green);
}

.status.error{
  display:block;
  color:var(--danger);
}

.status.info{
  display:block;
  color:var(--muted);
}

/* =========================
   LOGIN
========================= */

.login-card{
  max-width:480px;
  margin:auto;
}

.login-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#f5f3f8;
  border-radius:13px;
  padding:4px;
  margin-bottom:20px;
}

.login-tab{
  border:0;
  background:none;
  border-radius:10px;
  padding:10px;
  font-size:13px;
  font-weight:700;
  color:var(--muted);
}

.login-tab.active{
  background:white;
  color:var(--text);
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

/* =========================
   DASHBOARD
========================= */

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.dashboard-item{
  border:1px solid var(--border);
  background:white;
  border-radius:18px;
  padding:20px;
  text-align:left;
  transition:.2s;
}

.dashboard-item:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.dashboard-item h3{
  font-family:"Plus Jakarta Sans";
  font-size:15px;
  margin-bottom:7px;
}

.dashboard-item p{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

/* =========================
   SEARCH
========================= */

.search-bar{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:9px;
  margin-bottom:17px;
}

.search-results{
  display:grid;
  gap:12px;
}

.worker-card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
}

.worker-main{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.worker-card h3{
  font-family:"Plus Jakarta Sans";
  font-size:16px;
}

.worker-meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.65;
  margin-top:6px;
}

.badge{
  white-space:nowrap;
  height:max-content;
  padding:6px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
}

.badge.pending{
  background:#fff5dc;
  color:#9b6b00;
}

.badge.verified{
  background:var(--green-soft);
  color:var(--green);
}

.worker-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
  flex-wrap:wrap;
}

/* =========================
   DETAIL
========================= */

.detail-grid{
  display:grid;
  gap:12px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:1px solid var(--border);
  padding:10px 0;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-label{
  color:var(--muted);
  font-size:12px;
}

.detail-value{
  text-align:right;
  font-size:13px;
  font-weight:600;
}

/* =========================
   CHAT
========================= */

.chat-box{
  max-width:650px;
  margin:auto;
}

.messages{
  min-height:300px;
  max-height:55vh;
  overflow-y:auto;
  padding:5px 0 15px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:14px;
  font-size:13px;
  line-height:1.5;
}

.message.mine{
  align-self:flex-end;
  background:var(--purple);
  color:white;
  border-bottom-right-radius:5px;
}

.message.theirs{
  align-self:flex-start;
  background:#f1eff5;
  border-bottom-left-radius:5px;
}

.chat-input{
  display:flex;
  gap:8px;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translate(-50%,20px);
  background:#201d2b;
  color:white;
  padding:12px 15px;
  border-radius:12px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:10000;
  max-width:90%;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){
  .hero{
    padding-top:44px;
  }

  .hero h1{
    letter-spacing:-2.3px;
  }

  .hero p{
    font-size:15px;
  }

  .trust-grid{
    grid-template-columns:1fr;
  }

  .trust-item{
    border-right:0;
    border-bottom:1px solid var(--border);
    padding:14px 4px;
  }

  .trust-item:last-child{
    border-bottom:0;
  }

  .row,
  .search-bar,
  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:17px;
    border-radius:18px;
  }

  .form-footer{
    display:block;
  }

  .form-footer button{
    width:100%;
    margin-top:8px;
  }
}

/* hide native pages until rendered */
.hidden{
  display:none!important;
}
</style>
</head>

/* =========================================================
   UTILITIES
========================================================= */

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>el.classList.remove("show"),2800);
}


function isLoggedIn(){
  return !!window.currentSession;
}


async function refreshSession(){
  if(!supabaseClient){
    window.currentSession = null;
    return null;
  }

  const {data} =
    await supabaseClient.auth.getSession();

  window.currentSession =
    data?.session || null;

  return window.currentSession;
}


function requireLogin(target){
  if(!isLoggedIn()){
    toast(t("loginRequired"));
    openLogin(target);
    return false;
  }

  return true;
}


/* =========================================================
   NAVIGATION
========================================================= */

function navigate(screen, options={}){
  if(currentScreen !== screen){
    screenHistory.push(currentScreen);
  }

  currentScreen = screen;

  renderScreen(
    screen,
    options,
    "forward"
  );
}


function goBack(){
  const previous =
    screenHistory.pop() || "home";

  currentScreen = previous;

  renderScreen(
    previous,
    {},
    "back"
  );
}


function goHome(){
  screenHistory = [];
  currentScreen = "home";
  renderScreen("home",{}, "back");
}


/* =========================================================
   RENDER
========================================================= */

function renderScreen(screen, options={}, direction="forward"){

  const root =
    document.getElementById("screenRoot");

  let html = "";

  if(screen === "home"){
    html = homeHTML();
  }

  if(screen === "login"){
    html = loginHTML(options?.target || "dashboard");
  }

  if(screen === "dashboard"){
    html = dashboardHTML();
  }

  if(screen === "profile"){
    html = profileHTML();
  }

  if(screen === "search"){
    html = searchHTML();
  }

  if(screen === "detail"){
    html = detailHTML(selectedWorker);
  }

  if(screen === "chat"){
    html = chatHTML(selectedWorker);
  }

  root.innerHTML = html;

  const page =
    root.firstElementChild;

  if(page){
    page.classList.add(
      direction === "back"
        ? "enter-back"
        : "enter-forward"
    );
  }

  afterRender(screen, options);
}


function afterRender(screen){

  if(screen === "profile"){
    setupProfileMap();
    setupPortfolioPreview();
  }

  if(screen === "search"){
    loadWorkers();
  }

  if(screen === "dashboard"){
    updateDashboardState();
  }
}

function setLoginMode(mode){
  loginMode = mode;

  renderScreen(
    "login",
    {},
    "back"
  );
}


async function sendLoginOtp(target){

  const destination =
    document.getElementById("loginDestination")?.value.trim();

  if(!destination){
    toast(
      currentLang==="ml"
        ? "Email അല്ലെങ്കിൽ phone നൽകുക."
        : "Enter your email or phone."
    );
    return;
  }

  if(!supabaseClient){
    toast(
      currentLang==="ml"
        ? "Supabase key ചേർത്തിട്ടില്ല."
        : "Supabase key is not configured."
    );
    return;
  }

  let value = destination;

  if(loginMode === "phone"){
    value = normalizePhone(destination);
  }

  otpDestination = value;

  let result;

  if(loginMode === "email"){
    result =
      await supabaseClient.auth.signInWithOtp({
        email:value
      });
  }else{
    result =
      await supabaseClient.auth.signInWithOtp({
        phone:value
      });
  }

  if(result.error){
    setStatus(
      "loginStatus",
      result.error.message,
      "error"
    );
    return;
  }

  document
    .getElementById("otpField")
    ?.classList.remove("hidden");

  setStatus(
    "loginStatus",
    t("loginSent"),
    "success"
  );
}


async function verifyLoginOtp(target){

  const token =
    document.getElementById("loginOtp")?.value.trim();

  if(!token){
    toast("Enter OTP");
    return;
  }

  if(!supabaseClient){
    toast("Supabase is not configured.");
    return;
  }

  const params =
    loginMode==="email"
      ? {
          email:otpDestination,
          token,
          type:"email"
        }
      : {
          phone:otpDestination,
          token,
          type:"sms"
        };

  const {data,error} =
    await supabaseClient.auth.verifyOtp(params);

  if(error){
    setStatus(
      "loginStatus",
      error.message,
      "error"
    );
    return;
  }

  window.currentSession =
    data.session || null;

  toast(t("loginVerified"));

  if(target === "search"){
    navigate("search");
  }else if(target === "profile"){
    navigate("profile");
  }else{
    navigate("dashboard");
  }
}


function normalizePhone(phone){

  let p =
    phone.replace(/[^\d+]/g,"");

  if(p.startsWith("0")){
    p = "+91" + p.substring(1);
  }

  if(/^\d{10}$/.test(p)){
    p = "+91" + p;
  }

  return p;
}


function setStatus(id,message,type){

  const el =
    document.getElementById(id);

  if(!el) return;

  el.textContent = message;
  el.className = "status " + type;
}

function toggleLanguage(lang){

  if(selectedLanguages.includes(lang)){
    selectedLanguages =
      selectedLanguages.filter(x=>x!==lang);
  }else{
    selectedLanguages.push(lang);

  document.querySelectorAll(".lang-chip")
    .forEach(btn=>{
      btn.classList.toggle(

        selectedLanguages.includes(

      );

function openMapPicker(mode){

  mapMode = mode;

  const mapElement =
    document.getElementById("map");

  if(!mapElement) return;

  mapElement.style.display="block";

  if(mode==="current"){
    const search =
      document.getElementById("currentMapSearch");

    if(search) search.style.display="block";
  }

  setTimeout(()=>{

    if(!map){

      map =
        L.map("map").setView(
          [10.1632,76.6413],
          8
        );

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom:19,
          attribution:"© OpenStreetMap"
        }
      ).addTo(map);

      map.on("click",async e=>{
        await setMapLocation(
          e.latlng.lat,
          e.latlng.lng
        );
      });

    }

    map.invalidateSize();

  },100);
}


function useCurrentLocation(){

    toast(
      currentLang==="ml"

        : "Geolocation is not supported."
    );
    return;
  }

  navigator.geolocation.getCurrentPosition(

    async position=>{

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      await openMapPicker("current");

      setTimeout(async()=>{
        if(map){
          map.setView([lat,lng],16);
        }

        await setMapLocation(lat,lng);
      },200);

    },

    ()=>{
      toast(t("locationPermission"));

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );
}

async function setMapLocation(lat,lng){

  if(!map) return;

  if(mapMarker){
    map.removeLayer(mapMarker);
  }

  mapMarker =
    L.marker([lat,lng]).addTo(map);

  map.setView([lat,lng],16);

  const place =
    await reverseGeocode(lat,lng);

  if(mapMode==="current"){

    currentLocation = {
      text:place,
      lat,
      lng
    };

    const value =
      document.getElementById(
        "currentLocationValue"
      );

    if(value){

    }

    document.getElementById("location").value =
      place;

    document.getElementById("location_lat").value =
      lat;

    document.getElementById("location_lng").value =
      lng;

    autoDistrict(place);

  }else{

    preferredLocation = {
      text:place,
      lat,
      lng
    };

    const value =
      document.getElementById(
        "preferredLocationValue"
      );

    if(value){
      value.textContent = place;
      value.classList.add("selected");
    }

    document.getElementById(
      "preferred_lat"
    ).value = lat;

    document.getElementById(
      "preferred_lng"
    ).value = lng;

  }
}


async function reverseGeocode(lat,lng){

  try{

    const response =
      await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}`
      );

    const data =
      await response.json();

    return (
      data.display_name ||
      `${lat.toFixed(5)}, ${lng.toFixed(5)}`
    );

  }catch(e){

    return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

  }
}


async function searchMapPlace(mode){

  const input =
    document.getElementById(
      "currentMapSearchInput"
    );

  const query =
    input?.value.trim();

  if(!query){
    toast(
      currentLang==="ml"
        ? "ഒരു place നൽകുക."
        : "Enter a place."
    );
    return;
  }

  try{

    const response =
      await fetch(
        `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(query)}`
      );

    const data =
      await response.json();

    if(!data.length){
      toast(
        currentLang==="ml"
          ? "Place കണ്ടെത്താനായില്ല."
          : "Place not found."
      );
      return;
    }

    const result = data[0];

    await openMapPicker(mode);

    setTimeout(async()=>{

      if(map){
        map.setView(
          [parseFloat(result.lat),parseFloat(result.lon)],
          15
        );
      }

      await setMapLocation(
        parseFloat(result.lat),
        parseFloat(result.lon)
      );

    },150);

  }catch(e){

    toast(
      currentLang==="ml"
        ? "Map search failed."
        : "Map search failed."
    );

  }
}


function autoDistrict(place){

  const normalized =
    String(place).toLowerCase();

  const found =
    districts.find(
      d=>normalized.includes(
        d.toLowerCase()
      )
    );

  if(found){
    const select =
      document.getElementById("district");

    if(select){
      select.value=found;
    }
  }
}

    skills:finalSkill,

    company_name:company || null,

    job_role:role,

    duration,

    location:currentLocation.text,

    district,

    verification:"Pending",

    work_location:
      preferredLocation.text || null,

    preferred_location:
      preferredLocation.text || null,

    language:
      selectedLanguages.join(", "),

    availability,

    contact_phone:
      contactPhone || null,

    contact_whatsapp:
      whatsapp || null,

    contact_prefferance:
      preference || null,

    other_skill:
      selectedSkill === "Other"
        ? (otherSkill || null)
        : null,

    user_id:userId,

    location_lat:
      currentLocation.lat,

    location_lng:
      currentLocation.lng,

    preferred_lat:
      preferredLocation.lat,

    preferred_lng:
      preferredLocation.lng
  };


  setStatus(
    "profileStatus",
    currentLang==="ml"
      ? "Profile save ചെയ്യുന്നു..."
      : "Saving profile...",
    "info"
  );


  let result =
    await supabaseClient
      .from("workers")
      .insert(payload)
      .select()
      .single();


  /*
    Compatibility retry for existing DB columns.
  */

  if(
    result.error &&
    (
      result.error.message.includes("user_id") ||
      result.error.message.includes("location_lat") ||
      result.error.message.includes("location_lng") ||
      result.error.message.includes("preferred_lat") ||
      result.error.message.includes("preferred_lng")
    )
  ){

    const fallbackPayload = {

      full_name:name,
      skills:finalSkill,
      company_name:company || null,
      job_role:role,
      duration,
      location:currentLocation.text,
      district,
      verification:"Pending",
      work_location:
        preferredLocation.text || null,
      preferred_location:
        preferredLocation.text || null,
      language:
        selectedLanguages.join(", "),
      availability,
      contact_phone:
        contactPhone || null,
      contact_whatsapp:
        whatsapp || null,
      contact_prefferance:
        preference || null,
      other_skill:
        selectedSkill === "Other"
          ? (otherSkill || null)
          : null
    };

    result =
      await supabaseClient
        .from("workers")
        .insert(fallbackPayload)
        .select()
        .single();
  }


  if(result.error){

    setStatus(
      "profileStatus",
      result.error.message ||
      t("profileError"),
      "error"
    );

    return;
  }


  const worker =
    result.data;


  /* Upload portfolio after worker row exists */

  await uploadPortfolio(
    worker?.id,
    userId
  );


  setStatus(
    "profileStatus",
    t("profileSaved"),
    "success"
  );

  toast(t("profileSaved"));

  setTimeout(()=>{
    navigate("dashboard");
  },900);
}


/* =========================================================
   PORTFOLIO STORAGE
========================================================= */

async function uploadPortfolio(workerId,userId){

  const input =
    document.getElementById("portfolioFiles");

  const files =
    Array.from(input?.files || []);

  if(!files.length) return;

  if(!supabaseClient) return;

  /*
    Bucket:
    work-portfolio

    If the bucket is not created yet, the worker
    profile remains saved and the upload warning
    is shown instead of failing the entire profile.
  */

  for(const file of files){

    if(!file.type.startsWith("image/")){
      continue;
    }

    if(file.size > 5*1024*1024){
      continue;
    }

    const ext =
      file.name.split(".").pop() || "jpg";

    const random =
      Math.random()
        .toString(36)
        .substring(2,10);

    const path =
      `worker/${userId || "guest"}/${Date.now()}-${random}.${ext}`;

    const {error} =
      await supabaseClient
        .storage
        .from("work-portfolio")
        .upload(path,file,{
          upsert:false,
          contentType:file.type
        });

    if(error){

      console.warn(
        "Portfolio upload:",
        error.message
      );

      toast(
        currentLang==="ml"
          ? "Profile save ചെയ്തു. Portfolio upload പൂർത്തിയായില്ല."
          : "Profile saved. Portfolio upload could not be completed."
      );

      break;
    }
  }
}

    </div>

        placeholder="${esc(t("searchPlaceholder"))}">

      <select id="searchDistrict">

        <option value="">

async function loadWorkers(){

  const container =
    document.getElementById("searchResults");

  if(!container) return;

  if(!supabaseClient){

    container.innerHTML = `
      <div class="card">
        Supabase is not configured.
      </div>
    `;

    return;
  }


  const skill =
    document.getElementById("searchSkill")
      ?.value.trim();

  const district =
    document.getElementById("searchDistrict")
      ?.value;


  let query =
    supabaseClient
      .from("workers")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(50);


  if(skill){
    query =
      query.ilike(
        "skills",
        `%${skill}%`
      );
  }

  if(district){
    query =
      query.eq(
        "district",
        district
      );
  }


  const {data,error} =
    await query;


  if(error){

    container.innerHTML = `
      <div class="card">
        ${esc(error.message)}
      </div>
    `;

    return;
  }


  if(!data?.length){

    container.innerHTML = `
      <div class="card">
        ${esc(t("noResults"))}
      </div>
    `;

    return;
  }


  container.innerHTML =
    data.map(worker=>workerCardHTML(worker)).join("");
}

/* =========================================================
   CONTACT
========================================================= */

function callWorker(phone){

  if(!phone) return;

  window.location.href =
    "tel:" + normalizePhone(phone);
}


function whatsappWorker(phone){

  if(!phone) return;

  const number =
    normalizePhone(phone)
      .replace("+","");

  window.open(
    `https://wa.me/${number}`,
    "_blank"
  );
}


/* =========================================================
   CHAT
========================================================= */

let localMessages = [];


function openChat(worker){

  selectedWorker = worker;

  navigate("chat");
}


function chatHTML(worker){

  const messages =
    localMessages.length
      ? localMessages
      : [{
          from:"theirs",
          text:t("noMessages")
        }];


  return `
<section class="screen">
  <div class="screen-inner">

    <div class="page-top">

      <button class="back-btn" onclick="goBack()">
        ← ${esc(t("back"))}
      </button>

      <h1>${esc(t("chat"))}</h1>

      <p>
        ${esc(worker?.full_name || "Worker")}
      </p>

    </div>


    <div class="card chat-box">

      <div class="messages">

        ${messages.map(msg=>`
          <div class="message ${
            msg.from==="mine"
              ? "mine"
              : "theirs"
          }">
            ${esc(msg.text)}
          </div>
        `).join("")}

      </div>


      <div class="chat-input">

        <input
          id="chatMessage"
          placeholder="${esc(t("messagePlaceholder"))}">

        <button
          class="primary-btn"
          onclick="sendLocalMessage()">
          ${esc(t("send"))}
        </button>

      </div>

      <div class="helper"
           style="margin-top:10px">
        ${
          currentLang==="ml"
            ? "ഇത് local chat UI ആണ്; server-side real-time messaging ഇപ്പോൾ claim ചെയ്യുന്നില്ല."
            : "This is a local chat UI; server-side real-time messaging is not claimed here."
        }
      </div>

    </div>

  </div>
</section>
`;
}


function sendLocalMessage(){

  const input =
    document.getElementById("chatMessage");

  const text =
    input?.value.trim();

  if(!text) return;

  localMessages.push({
    from:"mine",
    text
  });

  renderScreen("chat",{}, "forward");
}


/* =========================================================
   LANGUAGE
========================================================= */

function changeLanguage(lang){

  currentLang = lang;

  localStorage.setItem(
    "kredvouch_language",
    lang
  );

  document.documentElement.lang =
    lang;

  const selector =
    document.getElementById(
      "languageSelector"
    );

  if(selector){
    selector.value=lang;
  }

  renderScreen(
    currentScreen,
    {},
    "back"
  );

  toast(t("languageSaved"));
}


/* =========================================================
   AUTH STATE
========================================================= */

async function initAuth(){

  await refreshSession();

  if(supabaseClient){

    supabaseClient.auth.onAuthStateChange(
      (_event,session)=>{

        window.currentSession =
          session || null;

      }
    );

  }
}


/* =========================================================
   START APP
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async()=>{

    const selector =
      document.getElementById(
        "languageSelector"
      );

    if(selector){
      selector.value =
        currentLang;
    }

    renderScreen(
      "home",
      {},
      "forward"
    );

    await initAuth();

    setTimeout(()=>{

      document
        .getElementById("intro")
        ?.classList.add("hide");

    },1500);

  }
);
