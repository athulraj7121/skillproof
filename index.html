<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillProof</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 18px;
      color: #6b7280;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    p {
      color: #6b7280;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .hidden {
      display: none;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    .back {
      background: transparent;
      color: #111827;
      border: 1px solid #d1d5db;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">SkillProof</div>

    <div class="tagline">
      Verified skills. Trusted workers.
    </div>

    <!-- Welcome Screen -->
    <div class="card" id="welcomeScreen">

      <h2>Welcome to SkillProof</h2>

      <p>
        Connect skilled workers with trusted employers
        through verified work experience.
      </p>

      <button onclick="selectRole('worker')">
        I'm a Worker
      </button>

      <button class="secondary" onclick="selectRole('employer')">
        I'm an Employer
      </button>

    </div>

    <!-- Worker Screen -->
    <div class="card hidden" id="workerScreen">

      <h2>Worker Account</h2>

      <p>
        Create your professional worker profile.
      </p>

      <input type="text" placeholder="Your name">

      <input type="text" placeholder="Your skill (e.g. Painter)">

      <input type="text" placeholder="Current or past company">

      <button onclick="createProfile('worker')">
        Continue
      </button>

      <button class="back" onclick="goBack()">
        Back
      </button>

    </div>

    <!-- Employer Screen -->
    <div class="card hidden" id="employerScreen">

      <h2>Employer Account</h2>

      <p>
        Find skilled and experienced workers.
      </p>

      <input type="text" placeholder="Company name">

      <input type="text" placeholder="What worker do you need?">

      <button onclick="createProfile('employer')">
        Continue
      </button>

      <button class="back" onclick="goBack()">
        Back
      </button>

    </div>

  </div>

  <script>
    function selectRole(role) {
      document.getElementById("welcomeScreen").classList.add("hidden");

      if (role === "worker") {
        document.getElementById("workerScreen").classList.remove("hidden");
      }

      if (role === "employer") {
        document.getElementById("employerScreen").classList.remove("hidden");
      }
    }

    function goBack() {
      document.getElementById("workerScreen").classList.add("hidden");
      document.getElementById("employerScreen").classList.add("hidden");
      document.getElementById("welcomeScreen").classList.remove("hidden");
    }

    function createProfile(role) {
      if (role === "worker") {
        alert("Worker profile setup started.");
      }

      if (role === "employer") {
        alert("Employer profile setup started.");
      }
    }
  </script>

</body>
</html>
