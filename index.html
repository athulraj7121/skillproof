<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SkillProof</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      margin-bottom: 15px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #2563eb;
    }

    .success {
      color: #15803d;
      font-weight: bold;
      margin-top: 12px;
    }

    .error {
      color: #dc2626;
      font-weight: bold;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .worker-card {
      border: 1px solid #e5e7eb;
      padding: 18px;
      border-radius: 12px;
      margin-top: 15px;
      background: #fafafa;
    }

    .worker-card h3 {
      margin-top: 0;
    }

    .tag {
      display: inline-block;
      background: #e5e7eb;
      padding: 5px 9px;
      border-radius: 20px;
      margin: 3px;
      font-size: 12px;
    }

    .verified {
      color: #15803d;
      font-weight: bold;
    }

    .not-verified {
      color: #b45309;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>SkillProof</h1>
  <p>Verified skills. Trusted workers.</p>
</header>

<div class="container">

  <!-- HOME -->
  <div id="homeSection" class="card">
    <h2>Welcome to SkillProof</h2>

    <p>
      Connect skilled workers with trusted employers
      through verified work experience.
    </p>

    <button onclick="showWorkerForm()">
      I'm a Worker
    </button>

    <button class="secondary" onclick="showEmployerSection()">
      I'm an Employer
    </button>
  </div>


  <!-- WORKER FORM -->
  <div id="workerSection" class="card hidden">

    <h2>Create Worker Profile</h2>

    <label>Full Name</label>
    <input
      type="text"
      id="fullName"
      placeholder="Enter your full name"
    >

    <label>Skills</label>
    <select id="skills">
      <option value="">Select your skill</option>
      <option value="Painter">Painter</option>
      <option value="Welder">Welder</option>
      <option value="Plumber">Plumber</option>
      <option value="Electrician">Electrician</option>
      <option value="Carpenter">Carpenter</option>
      <option value="Mason">Mason</option>
      <option value="Mechanic">Mechanic</option>
      <option value="Tile Worker">Tile Worker</option>
      <option value="AC Technician">AC Technician</option>
      <option value="Driver">Driver</option>
      <option value="Other">Other</option>
    </select>

    <label>Company Name</label>
    <input
      type="text"
      id="companyName"
      placeholder="Current or past company"
    >

    <label>Job Role</label>
    <input
      type="text"
      id="jobRole"
      placeholder="Example: Senior Painter"
    >

    <label>Duration</label>
    <input
      type="text"
      id="duration"
      placeholder="Example: 3 years"
    >

    <label>Location</label>
    <input
      type="text"
      id="location"
      placeholder="Example: Kasaragod"
    >

    <label>District</label>
    <select id="district">
      <option value="">Select District</option>
      <option value="Alappuzha">Alappuzha</option>
      <option value="Ernakulam">Ernakulam</option>
      <option value="Idukki">Idukki</option>
      <option value="Kannur">Kannur</option>
      <option value="Kasaragod">Kasaragod</option>
      <option value="Kollam">Kollam</option>
      <option value="Kottayam">Kottayam</option>
      <option value="Kozhikode">Kozhikode</option>
      <option value="Malappuram">Malappuram</option>
      <option value="Palakkad">Palakkad</option>
      <option value="Pathanamthitta">Pathanamthitta</option>
      <option value="Thiruvananthapuram">Thiruvananthapuram</option>
      <option value="Thrissur">Thrissur</option>
      <option value="Wayanad">Wayanad</option>
    </select>

    <label>Verification</label>
    <select id="verification">
      <option value="Not Verified">Not Verified</option>
      <option value="Pending">Pending</option>
      <option value="Verified">Verified</option>
    </select>

    <button onclick="saveWorker()">
      Create Worker Profile
    </button>

    <button
      class="secondary"
      onclick="goHome()"
    >
      Back
    </button>

    <div id="workerMessage"></div>

  </div>


  <!-- EMPLOYER SECTION -->
  <div id="employerSection" class="card hidden">

    <h2>Find Skilled Workers</h2>

    <label>Search by Skill</label>
    <select id="searchSkill">
      <option value="">All Skills</option>
      <option value="Painter">Painter</option>
      <option value="Welder">Welder</option>
      <option value="Plumber">Plumber</option>
      <option value="Electrician">Electrician</option>
      <option value="Carpenter">Carpenter</option>
      <option value="Mason">Mason</option>
      <option value="Mechanic">Mechanic</option>
      <option value="Tile Worker">Tile Worker</option>
      <option value="AC Technician">AC Technician</option>
      <option value="Driver">Driver</option>
      <option value="Other">Other</option>
    </select>

    <label>Search by District</label>
    <select id="searchDistrict">
      <option value="">All Districts</option>
      <option value="Alappuzha">Alappuzha</option>
      <option value="Ernakulam">Ernakulam</option>
      <option value="Idukki">Idukki</option>
      <option value="Kannur">Kannur</option>
      <option value="Kasaragod">Kasaragod</option>
      <option value="Kollam">Kollam</option>
      <option value="Kottayam">Kottayam</option>
      <option value="Kozhikode">Kozhikode</option>
      <option value="Malappuram">Malappuram</option>
      <option value="Palakkad">Palakkad</option>
      <option value="Pathanamthitta">Pathanamthitta</option>
      <option value="Thiruvananthapuram">Thiruvananthapuram</option>
      <option value="Thrissur">Thrissur</option>
      <option value="Wayanad">Wayanad</option>
    </select>

    <button onclick="searchWorkers()">
      Find Workers
    </button>

    <button
      class="secondary"
      onclick="goHome()"
    >
      Back
    </button>

    <div id="workerResults"></div>

  </div>

</div>


<script>

  /*
    ============================================
    SUPABASE CONFIGURATION
    ============================================

    Replace ONLY these two values with your
    actual Supabase project values.
  */

  const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";

  const SUPABASE_KEY = "YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY";


  /*
    ============================================
    PAGE NAVIGATION
    ============================================
  */

  function showWorkerForm() {

    document.getElementById("homeSection")
      .classList.add("hidden");

    document.getElementById("employerSection")
      .classList.add("hidden");

    document.getElementById("workerSection")
      .classList.remove("hidden");
  }


  function showEmployerSection() {

    document.getElementById("homeSection")
      .classList.add("hidden");

    document.getElementById("workerSection")
      .classList.add("hidden");

    document.getElementById("employerSection")
      .classList.remove("hidden");
  }


  function goHome() {

    document.getElementById("homeSection")
      .classList.remove("hidden");

    document.getElementById("workerSection")
      .classList.add("hidden");

    document.getElementById("employerSection")
      .classList.add("hidden");
  }


  /*
    ============================================
    SUPABASE REQUEST HELPER
    ============================================
  */

  async function supabaseRequest(endpoint, options = {}) {

    if (
      SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL" ||
      SUPABASE_KEY === "YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY"
    ) {
      throw new Error(
        "Supabase URL and key are not configured yet."
      );
    }

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/" + endpoint,
      {
        ...options,

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=representation",

          ...(options.headers || {})
        }
      }
    );

    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(errorText);
    }

    return response.json();
  }


  /*
    ============================================
    SAVE WORKER
    ============================================
  */

  async function saveWorker() {

    const message =
      document.getElementById("workerMessage");

    message.className = "";
    message.innerHTML = "";

    const fullName =
      document.getElementById("fullName").value.trim();

    const skills =
      document.getElementById("skills").value;

    const companyName =
      document.getElementById("companyName").value.trim();

    const jobRole =
      document.getElementById("jobRole").value.trim();

    const duration =
      document.getElementById("duration").value.trim();

    const location =
      document.getElementById("location").value.trim();

    const district =
      document.getElementById("district").value;

    const verification =
      document.getElementById("verification").value;


    if (!fullName ||
        !skills ||
        !companyName ||
        !jobRole ||
        !duration ||
        !location ||
        !district) {

      message.className = "error";

      message.innerHTML =
        "Please fill in all required fields.";

      return;
    }


    try {

      await supabaseRequest(
        "Workers",
        {
          method: "POST",

          body: JSON.stringify({
            full_name: fullName,
            skills: skills,
            company_name: companyName,
            job_role: jobRole,
            duration: duration,
            location: location,
            district: district,
            verification: verification
          })
        }
      );


      message.className = "success";

      message.innerHTML =
        "Worker profile created successfully!";


      document.getElementById("fullName").value = "";
      document.getElementById("skills").value = "";
      document.getElementById("companyName").value = "";
      document.getElementById("jobRole").value = "";
      document.getElementById("duration").value = "";
      document.getElementById("location").value = "";
      document.getElementById("district").value = "";
      document.getElementById("verification").value =
        "Not Verified";

    }

    catch (error) {

      console.error(error);

      message.className = "error";

      message.innerHTML =
        "Unable to save profile. Please check the Supabase connection.";
    }
  }


  /*
    ============================================
    SEARCH WORKERS
    ============================================
  */

  async function searchWorkers() {

    const results =
      document.getElementById("workerResults");

    results.innerHTML =
      "<p>Searching workers...</p>";


    const skill =
      document.getElementById("searchSkill").value;

    const district =
      document.getElementById("searchDistrict").value;


    try {

      let endpoint =
        "Workers?select=*";


      if (skill) {

        endpoint +=
          "&skills=eq." +
          encodeURIComponent(skill);
      }


      if (district) {

        endpoint +=
          "&district=eq." +
          encodeURIComponent(district);
      }


      const workers =
        await supabaseRequest(endpoint);


      if (!workers.length) {

        results.innerHTML =
          "<p>No workers found.</p>";

        return;
      }


      results.innerHTML = "";


      workers.forEach(worker => {

        const card =
          document.createElement("div");

        card.className =
          "worker-card";


        const verificationClass =
          worker.verification === "Verified"
            ? "verified"
            : "not-verified";


        card.innerHTML = `

          <h3>
            ${escapeHtml(worker.full_name || "Worker")}
          </h3>

          <p>
            <strong>Skill:</strong>
            ${escapeHtml(worker.skills || "-")}
          </p>

          <p>
            <strong>Job Role:</strong>
            ${escapeHtml(worker.job_role || "-")}
          </p>

          <p>
            <strong>Company:</strong>
            ${escapeHtml(worker.company_name || "-")}
          </p>

          <p>
            <strong>Experience:</strong>
            ${escapeHtml(worker.duration || "-")}
          </p>

          <p>
            <strong>Location:</strong>
            ${escapeHtml(worker.location || "-")}
          </p>

          <p>
            <strong>District:</strong>
            ${escapeHtml(worker.district || "-")}
          </p>

          <p class="${verificationClass}">
            ${escapeHtml(worker.verification || "Not Verified")}
          </p>

        `;


        results.appendChild(card);
      });

    }

    catch (error) {

      console.error(error);

      results.innerHTML =
        "<p class='error'>Unable to load workers. Please check the Supabase connection.</p>";
    }
  }


  /*
    ============================================
    SECURITY HELPER
    ============================================
  */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

</script>

</body>
</html>
